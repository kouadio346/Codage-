name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Vérifier l'environnement Java
        shell: bash
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$MAJOR_VER" ] || ! [ "$MAJOR_VER" -ge 17 ] 2>/dev/null; then
            echo "::error::Java 17 ou une version plus récente est requis (version détectée : ${JAVA_VER:-inconnue})."
            exit 1
          fi
          echo "Version majeure Java détectée : $MAJOR_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Créer un magasin de clés de débogage temporaire
        shell: bash
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
            if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
              KEYTOOL_BIN="keytool"
            fi
            if ! "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Impossible de générer le fichier temporaire ./debug.keystore avec keytool."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Le fichier ./debug.keystore est introuvable après la tentative de génération."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK exists
        shell: bash
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Fichier APK attendu introuvable : $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Fichiers APK détectés dans app/build/outputs/apk :"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Le répertoire app/build/outputs/apk n'existe pas."
            fi
            exit 1
          fi
          echo "APK de débogage vérifié : $EXPECTED_APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
